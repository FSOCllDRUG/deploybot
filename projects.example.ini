# /etc/deploybot/projects.ini — один такой файл на каждый сервер (install.sh создаёт его, chmod 600).
# Новый проект = новая секция ниже, код бота менять не нужно.

[bot]
# Как подписывать этот сервер в сообщениях.
name = germany vps
# Токен от @BotFather: у каждого сервера свой бот (один токен нельзя слушать с двух серверов)
# и не тот, что у самих проектов.
token = 123456:ABC...
# Ваш числовой Telegram id (узнать: @userinfobot); несколько — через запятую.
admins = 111111111

# Имя секции = имя проекта в кнопках: a-z, 0-9, _ и -.
[zapasik]
# Папка с git-клоном и docker-compose.yml. Обновление: git pull --ff-only, docker compose up -d --build.
dir = /root/zapasik
# Сервисы, которые обязаны работать после обновления (через пробел). Пусто — хоть какой-то контейнер.
check = app
# Что перезапускает кнопка «Перезапуск». Пусто — весь проект.
restart = app
# Если в обновлении изменился файл — ещё одна команда docker compose. По строке на файл.
# Caddyfile примонтирован файлом, и `up -d` не перезапускает caddy сам.
on_change =
    Caddyfile: restart caddy

# Сам бот: тогда кнопка «Обновить» обновляет и его (git pull, затем перезапуск через systemd).
[deploybot]
dir = /opt/deploybot
